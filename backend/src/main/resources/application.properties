# Configuração do PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/financeiro_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Asaas Configuration (Sandbox)
asaas.api.url=${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}
asaas.api.key=${ASAAS_API_KEY:}

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Evolution API v2 Configuration
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8081}
evolution.api.key=${EVOLUTION_API_KEY:bananadoce22}
evolution.api.instance=${EVOLUTION_INSTANCE:escolinha}

# Upload de Comprovantes Locais
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.comprovantes-dir=uploads/comprovantes

api.security.token.secret=${JWT_SECRET:bananadoce123}